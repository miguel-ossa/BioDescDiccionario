services:
  biodescdiccionario:
    build: .
    container_name: biodescdiccionario
    restart: unless-stopped
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      GRADIO_SERVER_NAME: "0.0.0.0"
      GRADIO_SERVER_PORT: "7860"
    # Límite memoria (compatible Docker viejo)
    mem_limit: 4g
